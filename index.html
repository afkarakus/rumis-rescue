<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Rumis Rescue — Kedileri köpeklerden kurtar, Rumis'in evine götür." />
    <title>Rumis Rescue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>

    <div id="app">
      <section class="screen screen--active" id="screen-menu" aria-label="Ana menü">
        <p class="brand">Rumis Rescue</p>
        <h1 class="headline">Kedileri eve getir</h1>
        <p class="lead">
          Her bölümde bir kediyi köpeklerden kurtar ve Rumis'in evine sok.
        </p>
        <div class="actions">
          <button type="button" class="btn btn--primary" id="btn-start">Oyuna başla</button>
          <button type="button" class="btn btn--ghost" id="btn-levels">Bölümler</button>
        </div>
        <p class="hint">Ok tuşları / WASD · mobilde kaydır</p>
      </section>

      <section class="screen" id="screen-levels" aria-label="Bölüm seçimi" hidden>
        <p class="brand brand--small">Rumis Rescue</p>
        <h2 class="headline headline--small">Bölümler</h2>
        <div class="level-grid" id="level-grid"></div>
        <button type="button" class="btn btn--ghost" id="btn-levels-back">Geri</button>
      </section>

      <section class="screen screen--play" id="screen-play" aria-label="Oyun" hidden>
        <header class="hud">
          <p class="hud-brand">Rumis Rescue</p>
          <p class="hud-level" id="hud-level">Bölüm 1</p>
          <p class="hud-cat" id="hud-cat">Şila</p>
        </header>
        <canvas id="game" width="960" height="540" aria-label="Oyun alanı"></canvas>
        <p class="play-hint" id="play-hint">Kediyi evin kapısına götür. Köpeklerden uzak dur!</p>
        <div class="touch-pad" id="touch-pad" aria-hidden="true">
          <button type="button" data-dir="up" aria-label="Yukarı">▲</button>
          <div class="touch-mid">
            <button type="button" data-dir="left" aria-label="Sol">◀</button>
            <button type="button" data-dir="right" aria-label="Sağ">▶</button>
          </div>
          <button type="button" data-dir="down" aria-label="Aşağı">▼</button>
        </div>
      </section>

      <section class="screen" id="screen-result" aria-label="Sonuç" hidden>
        <p class="brand brand--small">Rumis Rescue</p>
        <h2 class="headline headline--small" id="result-title">Kurtardın!</h2>
        <p class="lead" id="result-text"></p>
        <div class="actions">
          <button type="button" class="btn btn--primary" id="btn-next">Sonraki bölüm</button>
          <button type="button" class="btn btn--ghost" id="btn-retry">Tekrar dene</button>
          <button type="button" class="btn btn--ghost" id="btn-menu">Menü</button>
        </div>
      </section>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
